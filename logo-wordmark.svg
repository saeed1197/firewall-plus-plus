<svg width="640" height="160" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg">
  <title>Firewall++</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c232d"/>
      <stop offset="100%" stop-color="#0e1116"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a33028"/>
      <stop offset="100%" stop-color="#5c1a17"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a2020"/>
      <stop offset="100%" stop-color="#4a1010"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#f85149"/>
      <stop offset="60%" stop-color="#ff7043"/>
      <stop offset="100%" stop-color="#ffab40"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="640" height="160" rx="26" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="638.5" height="158.5" rx="25.5" fill="none" stroke="#28303c" stroke-width="1.5"/>

  <g transform="translate(22,12)">
    <path d="M 55,4 L 103,22 L 103,72 Q 103,108 55,130 Q 7,108 7,72 L 7,22 Z"
          fill="url(#shieldGrad)" stroke="#c0392b" stroke-width="2"/>
    <path d="M 55,16 L 91,30 L 91,72 Q 91,101 55,118 Q 19,101 19,72 L 19,30 Z"
          fill="url(#shieldInner)"/>
    <path d="M 55,40 C 42,52 34,64 38,80 C 40,90 47,98 55,101 C 63,98 70,90 72,80 C 76,64 68,52 55,40 Z"
          fill="url(#flameGrad)" filter="url(#glow)"/>
    <path d="M 55,54 C 49,62 46,71 49,80 C 51,86 55,90 55,90 C 55,90 59,86 61,80 C 64,71 61,62 55,54 Z"
          fill="#ffcc80" opacity="0.55"/>
    <path d="M 60,42 L 48,70 L 56,70 L 50,92 L 67,64 L 58,64 Z"
          fill="white" opacity="0.88"/>
  </g>

  <text x="148" y="104"
        font-family="'Cascadia Code','Consolas','SF Mono',monospace"
        font-size="56" font-weight="700">
    <tspan fill="#e6edf5">Firewall</tspan><tspan fill="#4c9aff">++</tspan>
  </text>

  <text x="150" y="128"
        font-family="'Cascadia Code','Consolas','SF Mono',monospace"
        font-size="13" fill="#4a5568" letter-spacing="0.5">
    Windows Firewall - finally under control
  </text>
</svg>
